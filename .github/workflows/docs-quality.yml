name: docs-quality

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  workflow:
    name: workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  markdown-and-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md

      - name: Link check (local files and images)
        if: always()
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --offline --hidden './**/*.md'

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
